<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 托管分流版</title>
    <style>
        body { font-family: "Inter", -apple-system, sans-serif; padding: 15px; background: radial-gradient(circle at top, #1c1c1e 0%, #0a0a0a 100%); color: #d1d1d6; min-height: 100vh; }
        .card { background: rgba(28, 28, 32, 0.85); padding: 20px; border-radius: 16px; border: 1px solid #3a3a3c; box-shadow: 0 8px 32px rgba(0,0,0,0.6); max-width: 500px; margin: 0 auto 15px; backdrop-filter: blur(10px); }
        .section-title { font-size: 0.9rem; font-weight: 600; color: #ffb7c5; margin-bottom: 15px; display: flex; align-items: center; text-transform: uppercase; letter-spacing: 1px; }
        .section-title::before { content: ""; width: 4px; height: 18px; background: #ffb7c5; margin-right: 10px; box-shadow: 0 0 10px #ffb7c5; border-radius: 2px; }
        label { font-size: 11px; color: #c08e9b; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px; border: 1px solid #3a3a3c; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #000000; color: #ffffff; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-update { background: #d44d70; color: white; } /* 樱花红-更新 */
        .btn-create { background: #8e4483; color: white; } /* 暮色紫-新建 */
        .btn-danger { background: #a33b3b; color: #fcc; } /* 灰红-删除 */
        .btn-fetch { background: #4a2d38; color: #ffb7c5; font-size: 13px; margin-bottom: 10px; border: 1px solid #5a3341; }
        #status { position: fixed; bottom: 20px; left: 20px; right: 20px; padding: 16px; border-radius: 8px; font-size: 14px; display: none; z-index: 100; text-align: center; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .loading { background: rgba(28, 28, 30, 0.9); color: #ffd60a; border-color: #ffd60a; }
        .success { background: rgba(28, 28, 30, 0.9); color: #32d74b; border-color: #32d74b; }
        .error { background: rgba(28, 28, 30, 0.9); color: #ff453a; border-color: #ff453a; }
        .user-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding: 15px; background: rgba(28, 28, 32, 0.85); border-radius: 16px; border: 1px solid #3a3a3c; max-width: 500px; margin: 0 auto 15px; backdrop-filter: blur(8px); }
        .user-profile img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #ffb7c5; box-shadow: 0 0 12px rgba(255, 183, 197, 0.4); }
        .user-info div { font-size: 15px; font-weight: 600; color: #ffffff; }
        .user-info span { font-size: 11px; color: #8e8e93; display: block; margin-top: 2px; }
    </style>
</head>
<body>

<div id="userProfile" class="user-profile" style="display:none;">
    <img id="userAvatar" src="" alt="avatar">
    <div class="user-info">
        <div id="userName">Loading...</div>
        <span id="userQuota">检测中...</span>
    </div>
</div>

<div class="card">
    <label>1. 我的 GitHub Token (自动保存)</label>
    <input type="password" id="token" placeholder="粘贴 ghp_ 开头的密钥" onchange="saveToken()">
    <input type="file" id="fileInput" accept=".html">
    <p style="font-size: 11px; color: red; margin: 0;">* 先选文件，再选操作</p>
</div>

<div class="card">
    <div class="section-title">方案 A：更新已有仓库</div>
    <button class="btn-fetch" onclick="fetchRepos()">刷新已有仓库列表 🔄</button>
    <select id="repoSelect">
        <option value="">-- 选择仓库 --</option>
    </select>
    <button class="btn-update" onclick="handleUpdate()">覆盖并同步 Pages</button>
    <button class="btn-fetch" style="background:#2d1b22; color:#ffb7c5; border: 1px solid #d44d70; margin-top:10px;" onclick="openLiveSite()">🌐 访问对应网页</button>

    <button class="btn-fetch" style="background:#2d1b22; color:#f8bbd0; border: 1px solid #8e4483; margin-top:10px;" onclick="downloadIndex()">📥 下载当前 index.html</button>
    <button class="btn-fetch" style="background:#1a237e; color:#c5cae9; border: 1px solid #3f51b5; margin-top:10px;" onclick="handleRename()">✏️ 修改仓库名 (同步更改网址后缀)</button>
    <button class="btn-danger" style="margin-top:10px;" onclick="handleDelete()">🗑️ 彻底删除该仓库</button>
</div>

<div class="card">
    <div class="section-title">方案 B：新建仓库托管</div>
    <label>输入新仓库名称 (英文)</label>
    <input type="text" id="newRepoName" placeholder="例如: my-new-web">
    <button class="btn-create" onclick="handleCreate()">一键创建+托管</button>
</div>

<div id="status"></div>

<script>
    const log = (msg, type) => {
        const s = document.getElementById('status');
        s.style.display = 'block';
        s.innerText = msg;
        s.className = type;
        if(type === 'success') setTimeout(()=>s.style.display='none', 5000);
    };

    const saveToken = () => {
        localStorage.setItem('gh_token', document.getElementById('token').value);
        if(document.getElementById('token').value) fetchUserInfo();
    };

    window.onload = () => {
        const token = localStorage.getItem('gh_token') || '';
        document.getElementById('token').value = token;
        if(token) fetchUserInfo();
    };

    async function fetchUserInfo() {
        try {
            const res = await ghFetch('https://api.github.com/user');
            if (!res.ok) throw new Error("Token 无效或已过期");
            const data = await res.json();
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('userAvatar').src = data.avatar_url;
            document.getElementById('userName').innerText = data.login + (data.name ? ` (${data.name})` : '');
            const storage = (data.disk_usage / 1024).toFixed(2);
            document.getElementById('userQuota').innerText = `仓库: ${data.public_repos}公开 / ${data.total_private_repos || 0}私有 | 占用: ${storage} MB`;
            log("Token 验证成功", "success");
            fetchRepos();
        } catch(e) {
            document.getElementById('userProfile').style.display = 'none';
            log(e.message, "error");
        }
    }

    async function ghFetch(url, method = 'GET', body = null) {
        const token = document.getElementById('token').value;
        const opts = {
            method,
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        };
        if (body) {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        return fetch(url, opts);
    }

    // 跳转到 Pages 页面
    function openLiveSite() {
        const repo = document.getElementById('repoSelect').value;
        if (!repo) return alert("请先选择一个仓库");
        const [user, name] = repo.split('/');
        // 检查是否是特殊主页仓库 (user.github.io)
        const url = name.toLowerCase() === `${user.toLowerCase()}.github.io` 
            ? `https://${user}.github.io/` 
            : `https://${user}.github.io/${name}/`;
        window.open(url, '_blank');
    }

    // 刷新列表
    async function fetchRepos() {
        try {
            const res = await ghFetch('https://api.github.com/user/repos?per_page=100&sort=updated');
            const repos = await res.json();
            const select = document.getElementById('repoSelect');
            select.innerHTML = '<option value="">-- 选择仓库 --</option>';
            repos.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.full_name;
                opt.innerText = r.name;
                select.appendChild(opt);
            });
        } catch(e) { log("列表刷新失败", "error"); }
    }

    // 核心上传逻辑
    async function uploadToGithub(fullPath) {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) throw new Error("请先选择 HTML 文件");
        
        const file = fileInput.files[0];
        const reader = new FileReader();
        
        return new Promise((resolve, reject) => {
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                try {
                    const fileRes = await ghFetch(`https://api.github.com/repos/${fullPath}/contents/index.html`);
                    let sha = null;
                    if (fileRes.ok) sha = (await fileRes.json()).sha;

                    const putRes = await ghFetch(`https://api.github.com/repos/${fullPath}/contents/index.html`, 'PUT', {
                        message: "Upload via Mobile",
                        content: base64,
                        sha: sha
                    });
                    if (putRes.ok) resolve(); else reject(new Error("文件上传失败"));
                } catch(err) { reject(err); }
            };
            reader.readAsDataURL(file);
        });
    }

    // 下载 index.html
    async function downloadIndex() {
        const repo = document.getElementById('repoSelect').value;
        if (!repo) return alert("请先选择一个仓库");
        log("正在拉取源码...", "loading");
        try {
            const res = await ghFetch(`https://api.github.com/repos/${repo}/contents/index.html`);
            if (!res.ok) throw new Error("未找到 index.html 或读取失败");
            const data = await res.json();
            // 处理 Base64 解码并兼容中文
            const binary = atob(data.content.replace(/\s/g, ''));
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const content = new TextDecoder().decode(bytes);
            
            const blob = new Blob([content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `index_${repo.split('/')[1]}.html`;
            a.click();
            URL.revokeObjectURL(url);
            log("✅ 下载成功", "success");
        } catch(e) { log(e.message, "error"); }
    }



    // 处理已有仓库更新
    async function handleUpdate() {
        const repo = document.getElementById('repoSelect').value;
        if (!repo) return alert("请选个仓库");
        log("正在更新...", "loading");
        try {
            await uploadToGithub(repo);
            log("✅ 更新成功！", "success");

        } catch(e) { log(e.message, "error"); }
    }

    // 处理新建仓库托管
    async function handleCreate() {
        const name = document.getElementById('newRepoName').value;
        if (!name) return alert("写个名字");
        log("正在疯狂创建并配置中...", "loading");
        
        try {
            const userRes = await ghFetch('https://api.github.com/user');
            const username = (await userRes.json()).login;

            // 1. 创建
            const createRes = await ghFetch('https://api.github.com/user/repos', 'POST', {
                name: name, auto_init: true
            });
            if (!createRes.ok) throw new Error("仓库名可能重复了");
            
            await new Promise(r => setTimeout(r, 2000)); // 歇两秒等分支生成

            // 2. 传文件
            await uploadToGithub(`${username}/${name}`);

            // 3. 开 Pages
            await ghFetch(`https://api.github.com/repos/${username}/${name}/pages`, 'POST', {
                source: { branch: "main", path: "/" }
            });

            log(`✅ 创建并部署成功！\n地址: https://${username}.github.io/${name}/`, "success");

            fetchRepos(); // 顺便刷新列表
        } catch(e) { log(e.message, "error"); }
    }

    // 修改仓库名称
    async function handleRename() {
        const repo = document.getElementById('repoSelect').value;
        if (!repo) return alert("请先选择一个仓库");
        const currentName = repo.split('/')[1];
        const newName = prompt("请输入新的仓库名称 (英文/数字/短横线):", currentName);
        if (!newName || newName.trim() === "" || newName.trim() === currentName) return;

        log("正在重命名仓库...", "loading");
        try {
            const res = await ghFetch(`https://api.github.com/repos/${repo}`, 'PATCH', { 
                name: newName.trim() 
            });
            if (res.ok) {
                log("✅ 重命名成功！网址后缀已同步更新", "success");
                await fetchRepos(); // 刷新列表
            } else {
                const data = await res.json();
                throw new Error(data.message || "重命名失败");
            }
        } catch(e) { log(e.message, "error"); }
    }

    // 彻底删除仓库
    async function handleDelete() {
        const repo = document.getElementById('repoSelect').value;
        if (!repo) return alert("请先选择一个要删除的仓库");
        
        const confirmMsg = `⚠️ 极其危险操作！\n确定要彻底删除仓库 [${repo}] 吗？\n删除后无法找回！\n(注：Token 必须勾选 'delete_repo' 权限)`;
        if (!confirm(confirmMsg)) return;

        log("正在执行删除...", "loading");
        try {
            const res = await ghFetch(`https://api.github.com/repos/${repo}`, 'DELETE');
            if (res.status === 204) {
                log("✅ 仓库已永久删除", "success");
                fetchRepos();
            } else {
                const data = await res.json();
                throw new Error(data.message || "删除失败，请检查 Token 权限");
            }
        } catch(e) { log(e.message, "error"); }
    }
</script>
</body>
</html>
